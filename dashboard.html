<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control tower</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<style>
.ct-k{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:720px){.ct-k{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ct-k>div{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 1px 3px #0000001f,0 2px 8px #0000000d}
.ct-k span{display:block;font-size:14px;color:var(--mu)}
.ct-k b{display:block;font-size:34px;font-weight:600;margin-top:10px;line-height:1.1;color:var(--tx)}
.ct-k b small{font-size:14px;font-weight:500;color:var(--mu);margin-left:4px}
.ct-k .ok b{color:var(--ok)}.ct-k .bad b{color:var(--er)}
.ct-b{border-radius:16px;padding:16px 12px}
.ct-b h2{font-size:19px;margin:0 0 4px}
.ct-b>p{margin:0 0 14px}
.ch{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.ch::-webkit-scrollbar{display:none}
.ch button{flex:none;font:inherit;font-size:13px;color:var(--tx);background:#fff;border:1px solid #747775;border-radius:999px;min-height:40px;padding:8px 10px;cursor:pointer}
.ch button.on{background:#e8f0fe;color:var(--bd);border-color:var(--b);font-weight:600}
.ct-t th{font-size:11px;font-weight:600;white-space:normal;line-height:1.2;padding:10px 3px}
.ct-t td{font-size:13.5px;padding:11px 3px}
.ct-t td.pl{font-weight:600;letter-spacing:.02em}
.ct-t td.c,.ct-t th.c{text-align:center}
.ct-t tbody tr:nth-child(even) td{background:#f8f9fa}
.tg{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.3;white-space:nowrap}
.tg.ok{background:#e6f4ea;color:var(--ok)}.tg.bad{background:#fce8e6;color:var(--er)}.tg.wt{background:#eceff3;color:#5f6368}
@media(max-width:400px){main{padding-left:12px;padding-right:12px}.ch{gap:5px}.ch button{font-size:12.5px;padding:8px 7px}.ct-t td{font-size:13px}.tg{padding:3px 6px;font-size:11px}}
@media(min-width:430px){.ct-b{padding:18px}.ch{gap:10px}.ch button{font-size:15px;min-height:44px;padding:8px 18px}.ct-t th{font-size:12px;padding:10px 6px}.ct-t td{font-size:14px;padding:11px 8px}.tg{font-size:12px;padding:3px 10px}}
</style>
</head><body>
<div id="app"></div>
<script src="assets/config.js"></script>
<script src="assets/vendor/preact.min.js"></script>
<script src="assets/vendor/hooks.umd.js"></script>
<script src="assets/vendor/htm.js"></script>
<script src="assets/lib.js"></script>
<script>
/* Tautan layar TV lama (dashboard.html?tv=1) diarahkan ke papan TV. */
if(/[?&]tv=1/.test(location.search)){location.replace('tv.html'+location.search);}
mountNav('dashboard');

var FILT=[['all','Semua'],['wait','Menunggu'],['load','Loading'],['done','Selesai']];
function grp(c){var s=c.status;if(s==='MASUK'||s==='SPM_DIBAGI')return'wait';if(s==='LOADING')return'load';return'done';}
function hasil(c){
  var t=c.tanda;
  if(t==='SESUAI')return{k:'ok',t:'Sesuai'};
  if(t==='LOMPAT'||t==='TERTUNDA'||t==='BEDA_URUT'){
    var n=Math.abs(c.selMuat||0);
    return{k:'bad',t:c.selMuat<0?'Maju '+n:c.selMuat>0?'Mundur '+n:'Beda urutan'};
  }
  return{k:'wt',t:'Belum muat'};
}
function sel(c){var v=c.selMuat;if(v==null)return c.tanda==='SESUAI'?'0':'–';return(v>0?'+':'')+v;}
function mn(v){return v==null?'-':v;}

function App(){
  var L=useLive(function(){return call('apiView','dashboard');},20000,'dash');
  var q=useState(''),f=useState('all');
  var d=L.st.d||{},k=d.kpi||{},all=d.list||[];
  var bad=all.filter(function(c){return hasil(c).k==='bad';}).length;
  var cnt={all:all.length};all.forEach(function(c){cnt[grp(c)]=(cnt[grp(c)]||0)+1;});
  var qq=q[0].replace(/\s+/g,'').toUpperCase();
  var rows=all.filter(function(c){
    return(f[0]==='all'||grp(c)===f[0])&&(!qq||String(c.nopol||'').replace(/\s+/g,'').toUpperCase().indexOf(qq)>=0);
  }).sort(function(a,b){return Number(a.no)-Number(b.no);});
  var cards=[
    ['Total mobil',k.total!=null?k.total:all.length,'',''],
    ['Tidak sesuai urutan',bad,'',bad?'bad':'ok'],
    ['Menunggu',k.waiting||0,'',''],
    ['Loading',k.loading||0,'',''],
    ['Completed',k.completed||0,'',''],
    ['Over target',k.over||0,'',k.over?'bad':''],
    ['Rata-rata tunggu',mn(k.avgWaiting),k.avgWaiting!=null?'mnt':'',''],
    ['Rata-rata loading',mn(k.avgLoading),k.avgLoading!=null?'mnt':'','']
  ];
  return h`<${Shell} title="Control tower" live=${L} wide=${true}>
    <section class="ct-k" aria-label="Ringkasan">${cards.map(function(c){
      return h`<div class=${c[3]}><span>${c[0]}</span><b>${c[1]}${c[2]?h`<small>${c[2]}</small>`:null}</b></div>`;
    })}</section>
    <section class="box ct-b">
      <h2>Cek urutan mobil</h2>
      <p class="mut">${all.length?all.length+' kendaraan hari ini.':'Belum ada kendaraan hari ini.'}</p>
      <input type="search" placeholder="Cari no. polisi" aria-label="Cari no. polisi" autoComplete="off" value=${q[0]} onInput=${function(e){q[1](e.target.value);}}/>
      <div class="ch" role="group" aria-label="Filter status">${FILT.map(function(x){
        return h`<button type="button" key=${x[0]} class=${f[0]===x[0]?'on':''} aria-pressed=${f[0]===x[0]} onClick=${function(){f[1](x[0]);}}>${x[1]}${x[0]==='all'?' ('+cnt.all+')':''}</button>`;
      })}</div>
      <div class="tb"><table class="ct-t">
        <thead><tr><th class="c">Datang ke-</th><th>No. Polisi</th><th class="c">Muat ke-</th><th class="c">Selisih</th><th>Keterangan</th></tr></thead>
        <tbody>${rows.length?rows.map(function(c){
          var r=hasil(c);
          return h`<tr key=${c.id}><td class="c">${c.no}</td><td class="pl">${c.nopol}</td><td class="c">${c.urutMuat!=null?c.urutMuat:'–'}</td><td class="c">${sel(c)}</td><td><span class=${'tg '+r.k}>${r.t}</span></td></tr>`;
        }):h`<tr><td colspan="5" class="mut" style="text-align:center;padding:22px 10px">${all.length?'Tidak ada yang cocok.':'Belum ada kendaraan hari ini.'}</td></tr>`}</tbody>
      </table></div>
      <p class="mut" style="margin:14px 0 0;text-align:center"><a href="tv.html">Buka tampilan layar TV</a></p>
    </section>
  </${Shell}>`;
}
preact.render(h`<${App}/>`,document.getElementById('app'));
</script>
</body></html>
