<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juru muat</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="app"></div>
<script src="assets/config.js"></script>
<script src="assets/vendor/preact.min.js"></script>
<script src="assets/vendor/hooks.umd.js"></script>
<script src="assets/vendor/htm.js"></script>
<script src="assets/lib.js"></script>
<script>
mountNav('juru');
function App(){
  var L=useLive(function(){return call('apiView','juru');},15000,'juru');
  var tt=useToast(),toast=tt[1],D=useDo(L,toast);
  var d=L.st.d||{},pl=usePelaku(d.users,'pelaku_juru');
  var cf=useState(null),why=useState(''),spm=useState('');
  function openCf(x,kind){why[1]('');spm[1](x.spm||'');cf[1]({c:x,kind:kind});}
  function close(){cf[1](null);why[1]('');spm[1]('');}
  function go(){
    var k=cf[0],c=k.c,fin=k.kind==='finish',sp=spm[0].trim().toUpperCase(),alasan=why[0];
    close();   /* tutup panel langsung; tampilan sudah diperbarui sebelum server menjawab */
    D.go(c.id,'apiAct',{action:k.kind,id:c.id,pelaku:pl[0],page:'juru',alasan:fin?'':alasan,spm:sp},
      'Berhasil. '+c.nopol+(fin?' selesai dimuat.':' mulai dimuat.'),
      function(x){return patchList(x,c.id,function(z){
        if(fin)return null;
        return Object.assign({},z,{status:'LOADING',start:clock().replace('.',':'),mnt:0,spm:sp||z.spm});
      });});
  }
  var k=cf[0],c=k&&k.c,fin=k&&k.kind==='finish',skip=k&&!fin&&d.next&&c.no!==d.next;
  return h`<${Shell} title="Juru muat" live=${L} toast=${tt[0]}>
    <section class="box"><${Who} users=${d.users} value=${pl[0]} set=${pl[1]}/>
      <div class="nx"><span>Giliran muat berikutnya</span><b>${d.next||'–'}</b></div></section>
    <section class="box">
      ${(d.list||[]).length?(d.list||[]).map(function(x){
        var wait=x.status==='MASUK';
        return h`<${Car} key=${x.id} c=${x} hot=${wait&&x.no===d.next}>
          <button class=${'btn s'+(wait?'':' g')} disabled=${!pl[0]||D.busy===x.id} onClick=${function(){openCf(x,wait?'start':'finish');}}>${wait?'Mulai muat':'Selesai muat'}</button>
        </${Car}>`;
      }):h`<p class="mut" style="margin:0">Tidak ada mobil yang menunggu atau sedang dimuat.</p>`}
    </section>
    ${k?h`<${Confirm} title=${(fin?'Selesai muat ':'Mulai muat ')+c.nopol+'?'} okLabel=${fin?'Ya, selesai muat':'Ya, mulai muat'} busy=${D.busy===c.id}
        disabled=${skip&&!why[0].trim()} onClose=${close} onOk=${go}
        text=${skip?'Mobil ini antrean '+c.no+', padahal giliran sekarang antrean '+d.next+'. Tulis alasannya agar tercatat.':(fin?'Waktu selesai muat dicatat sekarang.':'Waktu mulai muat dicatat sekarang.')}>
      <label>No. SPM (boleh kosong)<input class="up" value=${spm[0]} onInput=${function(e){spm[1](e.target.value);}} autoComplete="off" placeholder="contoh: SPM-1234"/></label>
      ${skip?h`<label>Alasan mendahului (wajib)<textarea value=${why[0]} onInput=${function(e){why[1](e.target.value);}}></textarea></label>`:null}
    </${Confirm}>`:null}
  </${Shell}>`;
}
preact.render(h`<${App}/>`,document.getElementById('app'));
</script>
</body></html>
