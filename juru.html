<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juru muat</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="app"></div>
<script src="assets/config.js"></script>
<script src="assets/vendor/preact.min.js"></script>
<script src="assets/vendor/hooks.umd.js"></script>
<script src="assets/vendor/htm.js"></script>
<script src="assets/lib.js"></script>
<script>
mountNav('juru');
function App(){
  var L=useLive(function(){return call('apiView','juru');},15000,'juru');
  var tt=useToast(),toast=tt[1],D=useDo(L,toast);
  var d=L.st.d||{},pl=usePelaku(d.users,'pelaku_juru');
  var cf=useState(null),why=useState('');
  function start(c,alasan){
    cf[1](null);why[1]('');   /* tutup panel langsung; tampilan sudah diperbarui sebelum server menjawab */
    D.go(c.id,'apiAct',{action:'start',id:c.id,pelaku:pl[0],page:'juru',alasan:alasan||''},'Berhasil. '+c.nopol+' mulai dimuat.',
      function(x){return patchList(x,c.id,function(k){return Object.assign({},k,{status:'LOADING',start:clock().replace('.',':'),mnt:0});});});
  }
  var c=cf[0],skip=c&&d.next&&c.no!==d.next;
  function close(){cf[1](null);why[1]('');}
  return h`<${Shell} title="Juru muat" live=${L} toast=${tt[0]}>
    <section class="box"><${Who} users=${d.users} value=${pl[0]} set=${pl[1]}/>
      <div class="nx"><span>Giliran muat berikutnya</span><b>${d.next||'–'}</b></div></section>
    <section class="box">
      ${(d.list||[]).length?(d.list||[]).map(function(x){
        return h`<${Car} key=${x.id} c=${x} hot=${x.status==='MASUK'&&x.no===d.next}>
          ${x.status==='MASUK'?h`<button class="btn s" disabled=${!pl[0]||D.busy===x.id} onClick=${function(){cf[1](x);}}>Mulai muat</button>`
            :h`<span class="mut">Sedang dimuat</span>`}
        </${Car}>`;
      }):h`<p class="mut" style="margin:0">Tidak ada mobil yang menunggu atau sedang dimuat.</p>`}
    </section>
    ${c?h`<${Confirm} title=${'Mulai muat '+c.nopol+'?'} okLabel="Ya, mulai muat" busy=${D.busy===c.id}
        disabled=${skip&&!why[0].trim()} onClose=${close} onOk=${function(){start(c,why[0]);}}
        text=${skip?'Mobil ini antrean '+c.no+', padahal giliran sekarang antrean '+d.next+'. Tulis alasannya agar tercatat.':'Waktu mulai muat akan dicatat sekarang.'}>
      ${skip?h`<label>Alasan mendahului (wajib)<textarea value=${why[0]} onInput=${function(e){why[1](e.target.value);}} autoFocus></textarea></label>`:null}
    </${Confirm}>`:null}
  </${Shell}>`;
}
preact.render(h`<${App}/>`,document.getElementById('app'));
</script>
</body></html>
